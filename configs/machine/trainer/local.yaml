# pytorch-lightning 2.x Trainer used for BOP inference (trainer.test only)
_target_: pytorch_lightning.Trainer
_convert_: all # plain python lists/dicts instead of omegaconf containers

max_epochs: 1
accelerator: gpu
devices: [0]
strategy: auto
precision: bf16-mixed
deterministic: False
detect_anomaly: False
enable_progress_bar: True
logger: False
enable_checkpointing: False
num_sanity_val_steps: 0
# plain torch.no_grad() instead of torch.inference_mode()
inference_mode: False
# fraction (float) or number (int) of test images, e.g. machine.trainer.limit_test_batches=5 for a smoke test
limit_test_batches: 1.0
