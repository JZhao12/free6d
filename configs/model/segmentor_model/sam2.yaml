_target_: src.model.sam2.CustomSam2AutomaticMaskGenerator

points_per_batch: 64
stability_score_thresh: 0.85 # SAM v1 used 0.97; too strict for SAM2 (proposal recall 71% -> 98% on YCB-V)
box_nms_thresh: 0.7
min_mask_region_area: 0

output_mode: binary_mask

segmentor_width_size: ${model.segmentor_width_size}

sam:
  _target_: src.model.sam2.load_sam2
  model_cfg: configs/sam2.1/sam2.1_hiera_l.yaml
  checkpoint_path: ${user.sam2_repo}/checkpoints/sam2.1_hiera_large.pt
  device: cuda
  apply_postprocessing: False

